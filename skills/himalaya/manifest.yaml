name: himalaya
version: 0.1.0
description: Email integration via the Himalaya CLI (IMAP + SMTP).
enabled: true

scope:
  - dm

# These env vars must be present in .env for the skill to work. The setup
# wizard asks for any that are missing and writes them for you.
required_secrets:
  - IMAP_HOST
  - IMAP_PORT
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_USER
  - SMTP_PASS
  - SMTP_FROM

# OS deps are optional hints — install.sh uses them to validate that
# `himalaya` is reachable on PATH. On macOS we prefer brew, on Linux cargo
# is the canonical source. install.sh handles both.
system_commands:
  - himalaya

# Bash-tool patterns Emma needs allowed when this skill is active.
# Merged into the per-session .claude/settings.json by the harness
# at session-start (step 4 of the multi-agent refactor). Without these,
# tightening the principal context's execMode from 'full' to 'allowlist'
# would silently break email — Emma calls `himalaya` directly via her
# Bash tool because there's no MCP server (see mcp_servers: [] below).
exec_allow:
  - "Bash(himalaya *)"

# No MCP server — Emma uses her built-in Bash tool to shell out to `himalaya`.
# Per-session config is written to $HOME/.config/himalaya/config.toml and
# references the env vars, so credentials only live in .env.
mcp_servers: []

setup_wizard:
  description: Collects IMAP + SMTP settings and installs the Himalaya CLI.
  questions:
    - key: IMAP_HOST
      prompt: "IMAP server host (e.g. imap.gmail.com, imap.fastmail.com)"
      validate: nonempty
      help: "The incoming-mail server. Check your provider's help pages if unsure."
    - key: IMAP_PORT
      prompt: "IMAP port"
      default: "993"
      validate: port
    - key: SMTP_HOST
      prompt: "SMTP server host (e.g. smtp.gmail.com, smtp.fastmail.com)"
      validate: nonempty
      help: "The outgoing-mail server."
    - key: SMTP_PORT
      prompt: "SMTP port"
      default: "465"
      validate: port
    - key: SMTP_USER
      prompt: "Email address / login (usually your full address)"
      validate: email
    - key: SMTP_PASS
      prompt: "IMAP + SMTP password (or app-specific password for Gmail/iCloud)"
      secret: true
      validate: nonempty
      help: "Stored in .env with mode 0600. Never written into himalaya config.toml."
    - key: SMTP_FROM
      prompt: "From address (usually same as login)"
      validate: email
