name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm before actions/setup-node so setup-node can use
      # pnpm's cache ("cache: pnpm"). The version comes from
      # package.json's packageManager field automatically.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (root + web)
        run: pnpm -r build
