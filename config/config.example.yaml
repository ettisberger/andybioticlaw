# andybioticlaw — main configuration file
#
# Copy this file to config/config.yaml and edit to taste.
# Secrets belong in .env (see .env.example).
#
# Reload behavior:
#   - SIGHUP (or `andybioticlaw config reload`) re-reads this file and applies
#     hot-reloadable fields in place.
#   - Restart-required fields are listed in src/config/reload.ts. Changes to
#     those fields while the service is running trigger a WARN log but the old
#     value stays active until a full restart (`systemctl restart andybioticlaw`).

service:
  name: andybioticlaw
  dataDir: ./data
  logLevel: info # debug | info | warn | error
  timezone: Europe/Zurich

# Agents — exactly one entry must have `default: true`. Adding a
# second is a config edit + restart; see docs/ARCHITECTURE.md
# "Adding a second agent" for the recipe.
#
# Tool permissions are driven by data/policies.json (per-context
# execMode + execAllow patterns), not this file.
agents:
  - id: emma
    name: Emma
    default: true
    # Valid model IDs (as of April 2026):
    #   claude-opus-4-7             — current flagship
    #   claude-opus-4-6
    #   claude-sonnet-4-6
    #   claude-haiku-4-5-20251001
    model: claude-opus-4-7
    # Cheap fallback used by the Opus↔Haiku router when routing.enabled
    # is true. The DM handler picks between `model` and `haikuModel`
    # per message.
    haikuModel: claude-haiku-4-5-20251001
    credentialsDir: ~/.claude
    streamIdleTimeoutSec: 120
    # Skills visible to this agent. ['*'] = every enabled skill.
    skills: ['*']
    # Cheap-model router (opt-in). Sends short/simple DMs to
    # `haikuModel` for a big cost reduction; keeps complex work on
    # `model`. Scheduled agent-tasks are NOT routed.
    routing:
      enabled: false
      minCharsForOpus: 120
  #
  # Adding a second agent (commented-out example — uncomment + edit):
  # Each agent is a distinct Claude Code persona that can have its own
  # model, skills allowlist, OAuth token, and system-prompt file.
  #
  # - id: work
  #   name: Work
  #   default: false
  #   model: claude-sonnet-4-6
  #   haikuModel: claude-haiku-4-5-20251001
  #   credentialsDir: ~/.claude          # share Emma's auth, or set a sibling dir
  #   streamIdleTimeoutSec: 120
  #   skills: [notes, himalaya]          # narrow skill list (vs. ['*'])
  #   # Optional: a separate Claude OAuth token for this agent. The runner
  #   # reads `process.env[tokenEnvVar]` and injects it as
  #   # CLAUDE_CODE_OAUTH_TOKEN for sessions of this agent. Useful when
  #   # one agent runs on a personal Pro plan and another on a Team plan.
  #   tokenEnvVar: WORK_CLAUDE_TOKEN
  #   # Optional: per-agent system prompt override. Path is relative to
  #   # the install dir; if unset, the bundled `system.base.md` is used.
  #   # systemPromptFile: prompts/work-agent.md
  #   routing:
  #     enabled: true
  #     minCharsForOpus: 80

# Routing rules — map incoming messages to a specific agent. Empty
# array means everything goes to the default agent above.
#
# Most-specific rule wins, in this precedence order:
#   chatId+userId match  >  chatId match  >  userId match  >
#   channel catch-all   >  default agent fallback
#
# Example (commented out — uncomment + edit to enable):
#
#   bindings:
#     - agentId: work
#       match:
#         channel: telegram
#         userIds: [123456789]          # DMs from this user → work agent
#     - agentId: research
#       match:
#         channel: telegram
#         chatIds: [-1009876543210]     # this group chat → research agent
bindings: []

telegram:
  dm:
    # Your Telegram numeric user id(s). Only these IDs can DM the bot;
    # every other user is rejected with an `unauthorized_access` audit
    # row. Find your id by messaging @userinfobot on Telegram. Leaving
    # this empty disables the bot (with a startup warning).
    allowedUserIds: []
    runMode: host
  group:
    # PLANNED — group chats are rejected with an audit-log entry in v1.
    allowedGroupIds: []
    runMode: workspace
    workspaceBase: ./data/workspaces/groups
  streamEditIntervalMs: 1200
  longTaskNotifyAfterMs: 60000
  conversationHistoryLimit: 50
  # Boot-time status notification. When `enabled`, the service sends
  # a one-line "🤖 <agent> online" message to the principal chat
  # after every successful systemd start. Includes version, skill
  # count, schedule count, timestamp. Useful as a deploy-completion
  # ping. Default: off (a service that restarts often during dev
  # would spam the chat). Both fields are restart-required.
  statusMessage:
    enabled: false
    # Which agent's name appears in the bold header. Defaults to the
    # agent with `default: true`. Only matters in multi-agent setups
    # (e.g. operator wants the work-agent's name on the boot notice).
    # agentId: emma

budget:
  dailyTokenLimit: 2000000
  perSessionTokenLimit: 200000
  perScheduleDefault: 50000
  dailyResetTime: '00:00' # in service.timezone

memory:
  # When true (default): Emma silently stores anything she decides is worth
  # remembering — matches the natural "just remember it" UX.
  # When false: every proposal from Emma triggers a Telegram inline-button
  # prompt ([✅ Add] / [❌ Dismiss]) before the entry is persisted. Flip to
  # false if you want explicit curation over every memory write.
  autoAccept: true
  defaultScopes: [global, user]
  ttlCleanupCron: '0 3 * * *'

messages:
  # If set, the nightly TTL cron deletes messages older than this many days.
  # Sessions themselves are retained (so the dashboard's Sessions list stays
  # useful for audit/debugging) — only the conversation bodies are pruned.
  # `null` (default) means "keep forever".
  retentionDays: null

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 18790
  # Basic-Auth is ENABLED by default as a second layer of defense in case the
  # dashboard is ever exposed beyond localhost (the Fastify app also does CSRF
  # double-submit checks on mutating routes). The service refuses to start if
  # `enabled: true` without a `passwordHash`. Use `andybioticlaw init` to
  # populate the hash interactively, OR set `enabled: false` if you accept the
  # risk of an unauthenticated dashboard (localhost-only deployments only).
  basicAuth:
    enabled: true
    username: admin
    passwordHash: ''

observability:
  heartbeatIntervalSec: 60
  heartbeatRetentionDays: 7
  errorsToTelegram: true
  errorChatIdOverride: null

skills:
  dir: ./skills
  autoLoadOnStart: true
